version: '3.8'

services:
  knowledge-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-service
    ports:
      - "8001:8001"
    volumes:
      - chroma_data:/app/data/chroma
    environment:
      - LOG_LEVEL=INFO
      # - OMP_NUM_THREADS=4  # Optional: Optimize CPU threads for ML inference
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
