[project]
name = "knowledge-service"
version = "0.1.0"
description = "Enterprise Knowledge Service for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "loguru>=0.7.2",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.1",
    "langchain-text-splitters>=0.2.2",
    "rank-bm25>=0.2.2",
    "tree-sitter>=0.22.3",
    "tree-sitter-python>=0.21.0",
    "tenacity>=8.4.2",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
knowledge-mcp = "mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "httpx>=0.27.0",
    "ruff>=0.4.10",
    "mypy>=1.10.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]
